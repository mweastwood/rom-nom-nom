edition = "2024";

package rom_nom_nom;

enum SegmentType {
  SEGMENT_TYPE_UNSPECIFIED = 0;
  SEGMENT_HEADER = 1;
  SEGMENT_BIN = 2;
  SEGMENT_CODE = 3;
  SEGMENT_DATA = 4;
  SEGMENT_RODATA = 5;
  SEGMENT_BSS = 6;
}

enum SubsegmentType {
  SUBSEGMENT_TYPE_UNSPECIFIED = 0;
  SUBSEGMENT_ASM = 1;
  SUBSEGMENT_C = 2;
  SUBSEGMENT_HASM = 3;
  SUBSEGMENT_DATA = 4;
  SUBSEGMENT_RODATA = 5;
  SUBSEGMENT_BIN = 6;
  SUBSEGMENT_BSS = 7;
}

message Subsegment {
  uint32 rom_start = 1;
  SubsegmentType type = 2;
  string name = 3;
  uint32 vram = 4;
  uint32 bss_size = 5;
}

message Segment {
  string name = 1;
  SegmentType type = 2;
  uint32 rom_start = 3;
  uint32 rom_end = 4;
  uint32 vram = 5;
  uint32 bss_size = 6;
  repeated Subsegment subsegments = 7;
  repeated string section_order = 8;
}

message CompilerFlags {
  repeated string flags = 1;
}

enum SymbolType {
  SYMBOL_TYPE_UNSPECIFIED = 0;
  SYMBOL_FUNC = 1;
  SYMBOL_DATA = 2;
  SYMBOL_RODATA = 3;
  SYMBOL_BSS = 4;
  SYMBOL_LABEL = 5;
}

message SymbolRegistryEntry {
  string name = 1;
  uint32 address = 2;
  SymbolType type = 3;
  uint32 size = 4;
  bool is_absolute = 5;
  uint32 rom_offset = 6;
  string description = 7;
}

message SymbolRegistry {
  repeated SymbolRegistryEntry entries = 1;
}

message GameConfig {
  string game_name = 1;
  string sha1 = 2;
  string basename = 3;
  repeated string symbol_files = 4;
  repeated Segment segments = 5;
  map<string, CompilerFlags> c_flags = 6;
  repeated string section_order = 7;
  repeated string include_dirs = 8;
  string macro_inc = 9;
  repeated SymbolRegistryEntry symbols = 10;
}
