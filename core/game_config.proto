edition = "2024";

package rom_nom_nom;

enum SegmentType {
  SEGMENT_TYPE_UNSPECIFIED = 0;
  SEGMENT_HEADER = 1;
  SEGMENT_BIN = 2;
  SEGMENT_CODE = 3;
  SEGMENT_DATA = 4;
  SEGMENT_RODATA = 5;
  SEGMENT_BSS = 6;
}

enum SubsegmentType {
  SUBSEGMENT_TYPE_UNSPECIFIED = 0;
  SUBSEGMENT_ASM = 1;
  SUBSEGMENT_C = 2;
  reserved 3;
  reserved SUBSEGMENT_HASM;
  SUBSEGMENT_DATA = 4;
  SUBSEGMENT_RODATA = 5;
  SUBSEGMENT_BIN = 6;
  SUBSEGMENT_BSS = 7;
}

message Subsegment {
  uint32 rom_start = 1;
  SubsegmentType type = 2;
  string name = 3;
  uint32 vram = 4;
  uint32 bss_size = 5;
}

message Segment {
  string name = 1;
  SegmentType type = 2;
  uint32 rom_start = 3;
  uint32 rom_end = 4;
  uint32 vram = 5;
  uint32 bss_size = 6;
  repeated Subsegment subsegments = 7;
  repeated string section_order = 8;
}

message CompilerFlags {
  repeated string flags = 1;
}

enum SymbolType {
  SYMBOL_TYPE_UNSPECIFIED = 0;
  SYMBOL_FUNC = 1;
  SYMBOL_DATA = 2;
  SYMBOL_RODATA = 3;
  SYMBOL_BSS = 4;
  SYMBOL_LABEL = 5;
}

message SymbolRegistryEntry {
  string name = 1;
  uint32 address = 2;
  SymbolType type = 3;
  uint32 size = 4;
  bool is_absolute = 5;
  uint32 rom_offset = 6;
  string description = 7;
}

message SymbolRegistry {
  repeated SymbolRegistryEntry entries = 1;
}

enum AstMutationKind {
  AST_MUTATION_UNSPECIFIED = 0;
  AST_MUTATION_COMMUTE_BINARY_OP = 1;
  AST_MUTATION_INVERT_IF_ELSE = 2;
  AST_MUTATION_REORDER_LOCAL_DECLS = 3;
  AST_MUTATION_TOGGLE_COMPOUND_ASSIGNMENT = 4;
  AST_MUTATION_WHILE_TO_FOR_LOOP = 5;
  AST_MUTATION_TOGGLE_UNSIGNED_CAST = 6;
  AST_MUTATION_INLINE_SINGLE_USE_TEMP = 7;
  AST_MUTATION_DIRECT_TYPED_GLOBAL = 8;
  AST_MUTATION_GLOBAL_ARRAY_ACCESS = 9;
  AST_MUTATION_POINTER_OFFSET_TO_ARRAY_INDEX = 10;
  AST_MUTATION_SWAP_ADJACENT_STATEMENTS = 11;
  AST_MUTATION_COALESCE_PARAM_COPY = 12;
  AST_MUTATION_ELIMINATE_DEAD_CALL_RETURN = 13;
  AST_MUTATION_TOGGLE_TRAILING_RETURN = 14;
  AST_MUTATION_SPLIT_SINGLE_USE_TEMP = 15;
  AST_MUTATION_VOLATILE_GLOBAL_ACCESS = 16;
  AST_MUTATION_PROPAGATE_REGISTER_COPY = 17;
  AST_MUTATION_HOIST_WHILE_GUARD = 18;
  AST_MUTATION_RELOAD_OR_EARLY_RETURN_VAR = 19;
  AST_MUTATION_TOGGLE_REGISTER_ANNOTATION = 20;
  AST_MUTATION_MERGE_SPLIT_SCRATCH_WEBS = 21;
  AST_MUTATION_TOGGLE_STORE_FLAG_CONDITIONAL = 22;
  AST_MUTATION_HOIST_LOOP_INVARIANT = 23;
}

message AstMutationStep {
  AstMutationKind kind = 1;
  uint32 site_index = 2;
  uint32 param = 3;
}

message FunctionTuningEntry {
  string function_name = 1;
  string module_name = 2;
  string input_sha1 = 3;
  repeated string c_flags = 4;
  repeated AstMutationStep ast_mutations = 5;
  uint32 bit_exact_instructions = 6;
  uint32 matching_instructions = 7;
  uint32 target_instructions = 8;
  bool is_bit_exact = 9;
}

message TuningCache {
  string game_name = 1;
  repeated FunctionTuningEntry entries = 2;
  map<string, CompilerFlags> module_c_flags = 3;
}

message GameConfig {
  string game_name = 1;
  string sha1 = 2;
  string basename = 3;
  repeated string symbol_files = 4;
  repeated Segment segments = 5;
  map<string, CompilerFlags> c_flags = 6;
  repeated string section_order = 7;
  repeated string include_dirs = 8;
  string macro_inc = 9;
  repeated SymbolRegistryEntry symbols = 10;
  repeated FunctionTuningEntry tuning_entries = 11;
  string tuning_cache_file = 12;
}
