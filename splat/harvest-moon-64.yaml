name: Harvest Moon 64 (USA)
sha1: 90631460f1876a14849df0541d534012b410a34c
options:
  basename: harvest-moon-64
  target_path: roms/harvest-moon-64.z64
  base_path: ..
  elf_path: build/harvest-moon-64/harvest-moon-64.elf
  ld_script_path: build/harvest-moon-64/harvest-moon-64.ld
  asm_path: asm/harvest-moon-64
  src_path: src/c/harvest-moon-64
  asset_path: assets/harvest-moon-64
  build_path: build/harvest-moon-64
  generated_asm_macros_directory: asm/harvest-moon-64
  ld_dependencies: True
  platform: n64
  compiler: KMC

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbols/harvest-moon-64.txt

  undefined_funcs_auto_path: build/harvest-moon-64/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/harvest-moon-64/undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: True
  # gfx_ucode: # one of [f3d, f3db, f3dex, f3dexb, f3dex2]

  generated_macro_inc_content: |
    .include "include/gas_compat.inc"

# Compiler options for C decompilation
c_flags:
  default: ["-O2", "-mips2", "-Wa,-O1"]
  boot: ["-O0"]
  audio: ["-O2", "-mips2", "-Wa,-O0", "-Wa,--defsym=__C_COMPILED__=1"]
  main: ["-O2", "-mips2", "-Wa,-O0"]
  math: ["-O2", "-mips2", "-Wa,-O0", "-Wa,--defsym=__C_COMPILED__=1"]
  display: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O0", "-Wa,--defsym=__C_COMPILED__=1", "-Wa,--defsym=__R4000_FPU__=1"]
  libultra_sinf: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O2"]
  libultra_gu_lookat: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O2"]
  libultra_gu_mtx: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O1", "-Wa,--defsym=__C_COMPILED__=1"]
  libultra_gu_ortho: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O2", "-Wa,--defsym=__GU_ORTHO__=1"]
  libultra_gu_scale: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O2"]
  libultra_gu_translate: ["-O2", "-mips2", "-mcpu=r4000", "-Wa,-O2"]

# Memory & ROM Segments: Defines the physical cartridge offsets and RDRAM virtual addresses
segments:
  # 0x0000 - 0x0040: Standard 64-byte N64 cartridge header (clock rate, entry PC, game code, title)
  - name: header
    type: header
    start: 0x0

  # 0x0040 - 0x1000: Initial Program Load 3 (IPL3 bootcode copied by PIF hardware to RSP DMEM)
  - name: ipl3
    type: bin
    start: 0x40

  # 0x1000 - 0x1050: Initial bootstrap entrypoint executed in RDRAM at 0x80025C00
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80025C00
    subsegments:
      - [0x1000, hasm]

  # 0x1050 - 0xFF5C0: Main game engine code and data loaded into RDRAM
  - name: main
    type: code
    start: 0x1050
    vram: 0x80025C50
    follows_vram: entry
    bss_size: 0x113870
    subsegments:
      # MIPS executable CPU instructions.
      # As functions are decompiled into C, split this section into named C files:
      - [0x1050, c, boot]
      - [0x1190, c, main]
      - [0x1AC0, c, math]
      - [0x1CF0, asm, graphic]
      - [0x4400, c, dma]
      - [0x4570, c, display]
      - [0x4F30, asm, sprite]
      - [0x63E0, asm, actor]
      - [0x9070, asm, player]
      - [0x0EBD0, asm, map]
      - [0x16C70, asm, camera]
      - [0x181C0, c, audio]
      - [0x18D70, c, message]
      - [0x211E0, c, layer]
      - [0x28FA0, asm, controller]
      - [0x29560, asm, title]
      - [0x31220, asm, event]
      - [0x40BD0, asm, item]
      - [0x49C20, asm, scene]
      - [0x506C0, asm, farm]
      - [0x61370, asm, festival]
      - [0x77390, asm, asset]
      - [0x87EB0, c, sound]
      - [0x88170, asm, schedule]
      - [0x8E0E0, asm, npc]
      - [0xB3020, c, time]
      - [0xB3940, asm]
      - [0xB4A00, asm]
      - [0xB7760, asm]
      - [0xB7B50, asm]
      - [0xB97C0, asm]
      - [0xCC770, asm]
      - [0xCD4D0, asm]
      - [0xCD870, asm]
