      - [0xD7DC0, asm]
      - [0xD7E50, asm]
      - [0xD7ED0, asm]
      - [0xD8040, asm]
      - [0xD8100, asm]
      - [0xD81A0, asm]
      - [0xD82A0, asm]
      - [0xD8330, asm]
      - [0xD83D0, asm]
      - [0xD89B0, asm]
      - [0xD8D00, asm]
      - [0xD9040, asm, libultra_sqrtf]
      - [0xD9050, asm, libultra_sinf]
      - [0xD91A0, asm, libultra_gu_lookat]
      - [0xD98B0, c, libultra_gu_mtx]
      - [0xD9B30, c, libultra_gu_ortho]
      - [0xD9DB0, asm, libultra_gu_rotate]
      - [0xDA450, c, libultra_gu_scale]
      - [0xDA530, asm, libultra_cosf]
      - [0xDA6D0, c, libultra_gu_translate]
      - [0xDA7A0, asm, libultra]
      # Initialized read-only & global data (.data, .rodata, jump tables)
      - [0xEBE10, data]
      # Uninitialized memory (.bss section zeroed on boot)
      - { type: bss, vram: 0x801241C0 }

  # 0xFF5C0 - 0x1000000: Game assets (textures, audio soundbanks, models, dialogue)
  - type: bin
    start: 0xFF5C0
    follows_vram: main

  # End of 16 MB cartridge marker (0x1000000 = 16,777,216 bytes)
  - [0x1000000]
